# AutoPatch — dependency update PRs for explicitly enrolled ForgeGrid.
# Does not change agent privileges, remote shell policy or production deployments.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"
