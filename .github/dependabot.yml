# AutoPatch: owned ForgeGrid repository only. Opens PRs; does not auto-merge or deploy.
# Linux/Windows Go build, unit tests, vet and race detection remain the security gates.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      timezone: Australia/Sydney
      time: "04:30"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"
